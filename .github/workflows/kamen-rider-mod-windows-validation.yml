name: Validate Kamen Rider Craft v0.7 on Windows

on:
  push:
    branches:
      - kamen-rider-mod-neoforge-1.21.1
    paths:
      - 'kamen-rider-mod/**'
      - '.github/workflows/kamen-rider-mod-windows-validation.yml'

concurrency:
  group: kamen-rider-mod-v07-windows-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: kamen-rider-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: KamenRiderCraft-v0.7-windows
          path: kamen-rider-mod/build/libs/*.jar
