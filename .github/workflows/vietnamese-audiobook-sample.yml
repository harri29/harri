name: Vietnamese Audiobook Sample

on:
  push:
    paths:
      - "samples/tts/sample.txt"
      - "skills/vietnamese-audiobook/**"
  workflow_dispatch:

jobs:
  tts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r skills/vietnamese-audiobook/requirements.txt

      - name: Generate Vietnamese audiobook sample
        run: |
          python skills/vietnamese-audiobook/scripts/audiobook_tts.py             samples/tts/sample.txt             -o build/audio             --voice vi-VN-NamMinhNeural             --rate=-8%

      - name: Copy MP3 into repository
        run: |
          cp build/audio/audiobook.mp3 samples/tts/sample_namminh.mp3

      - name: Commit generated MP3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/tts/sample_namminh.mp3
          git diff --cached --quiet || git commit -m "Generate Vietnamese TTS sample"
          git push

      - name: Upload sample audio
        uses: actions/upload-artifact@v4
        with:
          name: vietnamese-audiobook-sample
          path: build/audio/audiobook.mp3
